name: 网页更新监控

on:
  schedule:
    # GitHub Actions 最短间隔 5 分钟；错开整点高峰。
    # 定时器只作保底/自愈：主节奏由运行末尾的「接力触发」维持（见 scripts/chain.py）
    - cron: '4-59/5 * * * *'
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: web-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 国赛官网/报名系统的《获奖名单》是扫描件，要用 OCR 才读得出人名。
      # 模型约 42MB，缓存起来，避免每轮都重下。
      - name: 缓存中文 OCR 模型
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tessdata
          key: tessdata-chi-sim-standard-v1

      - name: 准备中文 OCR 模型
        run: |
          if ! command -v tesseract >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          fi
          mkdir -p "${{ runner.temp }}/tessdata"
          F="${{ runner.temp }}/tessdata/chi_sim.traineddata"
          if [ ! -s "$F" ]; then
            curl -fsSL -o "$F" \
              https://raw.githubusercontent.com/tesseract-ocr/tessdata/main/chi_sim.traineddata
          fi
          ls -lh "$F"

      - name: 执行监控
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESSDATA_PREFIX: ${{ runner.temp }}/tessdata
        run: python src/monitor.py

      - name: 接力触发下一次运行
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_INTERVAL: '280'
        run: python3 scripts/chain.py
