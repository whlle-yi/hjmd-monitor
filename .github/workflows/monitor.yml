name: 网页更新监控

on:
  schedule:
    # 15 分钟一轮：降低对目标站点的访问频率（保底/自愈用，主节奏在 chain.py）
    - cron: '9-59/15 * * * *'
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: web-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 侦察间隔：平时 15 分钟；「加密窗口」内 2 分钟。
      # 窗口 = 北京时间 2026-11-07 19:40 ～ 21:00（名单公布概率最高的时段），
      # 窗口外自动恢复 15 分钟，无需人工干预。接力链每轮实时读取本间隔。
      - name: 计算本轮侦察间隔
        run: |
          H=$(TZ=Asia/Shanghai date +%m%d%H%M)
          if [ "$H" -ge 11071940 ] && [ "$H" -le 11072100 ]; then
            echo "进入加密侦察窗口（2 分钟/轮）: $H"
            echo "TARGET_INTERVAL=120" >> "$GITHUB_ENV"
          else
            echo "常规节奏（15 分钟/轮）: $H"
            echo "TARGET_INTERVAL=900" >> "$GITHUB_ENV"
          fi

      - name: 执行监控
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/monitor.py

      - name: 接力触发下一次运行
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/chain.py
