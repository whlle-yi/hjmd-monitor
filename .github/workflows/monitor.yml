name: 网页更新监控

on:
  schedule:
    # 作息表（北京时间）：白天+晚间 15 分钟保底、夜间 60 分钟保底。
    # 主节奏由 chain.py 接力，每轮按下面的「计算侦察间隔」动态决定（cron 是 UTC，已换算）。
    - cron: '9-59/15 0-15 * * *'   # 北京 08:00-23:59 白天+晚间保底 15 分钟
    - cron: '9 16-23 * * *'        # 北京 00:00-07:59 夜间保底 60 分钟
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: web-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 侦察间隔作息表（北京时间，名单为各赛区逐日发布，每晚都可能出）：
      #   晚间黄金段 19:30-22:00 -> 3 分钟/轮（每天自动加密）
      #   白天 08:00-19:29 / 22:00-23:59 -> 15 分钟/轮
      #   深夜 00:00-07:59 -> 60 分钟/轮（发布概率极低，降低对站点的访问）
      # 名单正式公布、邮件收到后可把本步骤改回单一 900 恢复常态。
      - name: 计算本轮侦察间隔
        run: |
          H=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$H" -ge 1930 ] && [ "$H" -le 2200 ]; then
            echo "晚间黄金段（3 分钟/轮）: $H"
            echo "TARGET_INTERVAL=180" >> "$GITHUB_ENV"
          elif [ "$H" -lt 0800 ]; then
            echo "深夜低频（60 分钟/轮）: $H"
            echo "TARGET_INTERVAL=3600" >> "$GITHUB_ENV"
          else
            echo "白天常规（15 分钟/轮）: $H"
            echo "TARGET_INTERVAL=900" >> "$GITHUB_ENV"
          fi

      - name: 执行监控
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/monitor.py

      - name: 接力触发下一次运行
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/chain.py
