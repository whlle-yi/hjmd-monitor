name: 网页更新监控

on:
  schedule:
    # GitHub Actions 最短间隔 5 分钟；错开整点高峰。
    # 定时器只作保底/自愈：主节奏由运行末尾的「接力触发」维持（见 scripts/chain.py）
    - cron: '4-59/5 * * * *'
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: web-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行监控
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/monitor.py

      - name: 接力触发下一次运行
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_INTERVAL: '280'
        run: python3 scripts/chain.py
